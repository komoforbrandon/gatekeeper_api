services:
  - type: web
    name: gatekeeper-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    preDeployCommand: node scripts/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gatekeeper_db
          property: connectionString

databases:
  - name: gatekeeper_db
    plan: free
